<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Resultados Azar Chile - Epicentro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body id="bodyJuego">

  <section class="banner-oficial" id="bannerColor">
    <div class="banner-top">
      <span class="badge" id="badgeJuego">Juego</span>
      <span id="bannerTexto">Seleccionando sorteo...</span>
    </div>

    <div class="banner-monto">
      <span class="monto" id="bannerMonto">$0</span>
      <span class="millones" id="unidadMonto">Mil</span>
    </div>

    <p class="banner-descripcion">
      Resultados obtenidos de fuentes oficiales para la Región de Valparaíso.
    </p>
  </section>

  <section class="buscador">
    <select id="selectSorteo">
      <option value="">Selecciona sorteo</option>
    </select>
    <select id="selectFecha">
      <option value="">Selecciona fecha</option>
    </select>
    <button id="btnEmbed" type="button" disabled>Mostrar embed</button>
  </section>

  <section class="embed" id="embedBox" hidden>
    <p class="embed-title"><strong>Código embed (iframe):</strong></p>
    <textarea id="embedCode" readonly></textarea>
    <div class="embed-actions">
      <button id="copyEmbed" type="button">Copiar</button>
    </div>
  </section>

  <main id="resultados"></main>

  <footer>
    <p>DIARIO EL EPICENTRO - Información al instante.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
