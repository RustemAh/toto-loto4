<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Resultados Toto 3 - Epicentro Chile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { background: #f4f7f6; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
    .banner-oficial { background: linear-gradient(135deg, #003b8e 0%, #0056b3 100%); color: white; padding: 30px 20px; text-align: center; border-bottom: 5px solid #00265d; }
    .badge { background: #ffd400; color: #003b8e; padding: 5px 12px; border-radius: 15px; font-weight: bold; font-size: 12px; text-transform: uppercase; }
    .banner-titular { font-size: 3.5rem; font-weight: 900; margin: 10px 0; }
    .buscador { display: flex; justify-content: center; padding: 20px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    select { padding: 12px; border-radius: 8px; border: 1px solid #ddd; width: 250px; font-size: 16px; cursor: pointer; text-align: center; font-weight: 600; color: #333; }
    .card { background: white; max-width: 500px; margin: 20px auto; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .sorteo-info { text-align: center; color: #8d99ae; font-size: 13px; margin-bottom: 20px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .sorteo-bloque { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px dashed #eee; text-align: center; }
    .sorteo-bloque:last-child { border: none; }
    .sorteo-bloque h3 { color: #666; font-size: 14px; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 0.5px; }
    .bolas { display: flex; justify-content: center; gap: 12px; }
    .bola { width: 55px; height: 55px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #0056b3, #003b8e); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: 2px solid #00265d; }
    .footer-legal { padding: 30px 20px; text-align: center; font-size: 11px; color: #7f8c8d; max-width: 600px; margin: 0 auto; }
    .brand-footer { margin-top: 15px; font-weight: bold; color: #2c3e50; letter-spacing: 1px; }
  </style>
</head>
<body>
  <section class="banner-oficial">
    <div class="banner-top"><span class="badge">Polla Chilena</span></div>
    <div class="banner-titular">Toto 3</div>
    <p>Resultados oficiales de los tres sorteos del día</p>
  </section>

  <section class="buscador">
    <select id="selectFecha"><option value="">Cargando fechas...</option></select>
  </section>

  <main id="resultados"></main>

  <footer class="footer-legal">
    <p><strong>ADVERTENCIA:</strong> Este sitio es informativo. Los únicos resultados oficiales son los protocolizados por Polla Chilena de Beneficencia S.A. Verifique su cartón en agencias autorizadas.</p>
    <div class="brand-footer">DIARIO EL EPICENTRO | Viña del Mar</div>
  </footer>

  <script>
    // Tu nueva ID de planilla
    const SHEET_ID = "1dRIR53JdyxVz0d3nGsSEEfsIVs_E6rvVKt8kVmQ_E7c"; 
    const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
    const contenedor = document.getElementById("resultados");
    const selectFecha = document.getElementById("selectFecha");
    let ALL_DATA = [];

    fetch(URL).then(r => r.text()).then(text => {
      // Limpiar el JSON de Google
      const match = text.match(/setResponse\(([\s\S]*?)\);?\s*$/);
      if (!match) return;
      const json = JSON.parse(match[1]);
      
      const colMap = {};
      json.table.cols.forEach((c, i) => { 
        if(c.label) colMap[c.label.toLowerCase().trim()] = i; 
      });

      ALL_DATA = json.table.rows.map(row => {
        const get = col => {
          const index = colMap[col];
          return row.c && row.c[index] ? row.c[index].v : "";
        };
        
        return {
          sorteo: get("sorteo").toString(),
          fecha: get("fecha").toString(),
          juegos: [
            { nombre: "Sorteo Día", nums: get("dia") ? get("dia").toString().split("") : [] },
            { nombre: "Sorteo Tarde", nums: get("tarde") ? get("tarde").toString().split("") : [] },
            { nombre: "Sorteo Noche", nums: get("noche") ? get("noche").toString().split("") : [] }
          ].filter(j => j.nums.length > 0)
        };
      }).filter(item => item.fecha).sort((a, b) => Number(b.sorteo) - Number(a.sorteo));

      cargarSelectores();
      if(ALL_DATA.length) { 
        selectFecha.value = ALL_DATA[0].fecha; 
        render(); 
      }
    });

    function cargarSelectores() {
      // Poblamos el select solo con las fechas
      selectFecha.innerHTML = ALL_DATA.map(x => `<option value="${x.fecha}">${x.fecha}</option>`).join("");
    }

    function render() {
      const s = ALL_DATA.find(x => x.fecha === selectFecha.value);
      if(!s) return;
      
      let html = `
        <div class="card">
          <div class="sorteo-info">Sorteo N° ${s.sorteo}</div>`;
      
      s.juegos.forEach(j => {
        html += `
          <div class="sorteo-bloque">
            <h3>${j.nombre}</h3>
            <div class="bolas">
              ${j.nums.map(n => `<div class="bola">${n}</div>`).join("")}
            </div>
          </div>`;
      });
      contenedor.innerHTML = html + `</div>`;
    }

    selectFecha.addEventListener("change", render);
  </script>
</body>
</html>
